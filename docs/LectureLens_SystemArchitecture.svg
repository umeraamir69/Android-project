<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="ui" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="dom" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="data" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="proc" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">LectureLens — System Architecture</text>
  <text x="550" y="54" text-anchor="middle" font-size="13" fill="#475569">MVVM + Clean Architecture · Android (Kotlin / Jetpack Compose)</text>

  <!-- Android Device boundary -->
  <rect x="30" y="80" width="760" height="640" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="50" y="104" font-size="13" font-weight="600" fill="#475569">Android Device</text>

  <!-- Presentation Layer -->
  <rect x="50" y="120" width="720" height="110" rx="10" fill="url(#ui)" stroke="#3b82f6"/>
  <text x="65" y="142" font-size="14" font-weight="700" fill="#1e3a8a">Presentation Layer  ·  Jetpack Compose + ViewModel</text>
  <g font-size="12" fill="#1e3a8a">
    <rect x="65"  y="158" width="110" height="58" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="120" y="180" text-anchor="middle" font-weight="600">Login</text>
    <text x="120" y="200" text-anchor="middle" font-size="10">LoginViewModel</text>

    <rect x="185" y="158" width="110" height="58" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="240" y="180" text-anchor="middle" font-weight="600">Library</text>
    <text x="240" y="200" text-anchor="middle" font-size="10">LibraryViewModel</text>

    <rect x="305" y="158" width="110" height="58" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="360" y="180" text-anchor="middle" font-weight="600">Upload</text>
    <text x="360" y="200" text-anchor="middle" font-size="10">UploadViewModel</text>

    <rect x="425" y="158" width="110" height="58" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="480" y="180" text-anchor="middle" font-weight="600">Lecture View</text>
    <text x="480" y="200" text-anchor="middle" font-size="10">LectureViewModel</text>

    <rect x="545" y="158" width="110" height="58" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="600" y="180" text-anchor="middle" font-weight="600">Search</text>
    <text x="600" y="200" text-anchor="middle" font-size="10">SearchViewModel</text>

    <rect x="665" y="158" width="95"  height="58" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="712" y="180" text-anchor="middle" font-weight="600">Settings</text>
    <text x="712" y="200" text-anchor="middle" font-size="10">API key · consent</text>
  </g>

  <!-- Domain Layer -->
  <rect x="50" y="250" width="720" height="100" rx="10" fill="url(#dom)" stroke="#16a34a"/>
  <text x="65" y="272" font-size="14" font-weight="700" fill="#14532d">Domain Layer  ·  Use Cases (pure Kotlin)</text>
  <g font-size="11" fill="#14532d">
    <rect x="65"  y="286" width="135" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="132" y="306" text-anchor="middle" font-weight="600">RecordLecture</text>
    <text x="132" y="322" text-anchor="middle" font-size="10">capture + persist</text>

    <rect x="210" y="286" width="135" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="277" y="306" text-anchor="middle" font-weight="600">TranscribeAudio</text>
    <text x="277" y="322" text-anchor="middle" font-size="10">STT routing</text>

    <rect x="355" y="286" width="135" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="422" y="306" text-anchor="middle" font-weight="600">GenerateNotes</text>
    <text x="422" y="322" text-anchor="middle" font-size="10">map-reduce summary</text>

    <rect x="500" y="286" width="125" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="562" y="306" text-anchor="middle" font-weight="600">SearchLectures</text>
    <text x="562" y="322" text-anchor="middle" font-size="10">FTS / RAG</text>

    <rect x="635" y="286" width="125" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="697" y="306" text-anchor="middle" font-weight="600">ExportLecture</text>
    <text x="697" y="322" text-anchor="middle" font-size="10">md / pdf / share</text>
  </g>

  <!-- Data Layer -->
  <rect x="50" y="370" width="450" height="200" rx="10" fill="url(#data)" stroke="#d97706"/>
  <text x="65" y="392" font-size="14" font-weight="700" fill="#78350f">Data Layer  ·  Repositories</text>
  <g font-size="11" fill="#78350f">
    <rect x="65"  y="406" width="135" height="44" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="132" y="432" text-anchor="middle" font-weight="600">LectureRepository</text>

    <rect x="210" y="406" width="135" height="44" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="277" y="432" text-anchor="middle" font-weight="600">CourseRepository</text>

    <rect x="355" y="406" width="135" height="44" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="422" y="432" text-anchor="middle" font-weight="600">TranscriptionRepo</text>

    <rect x="65"  y="460" width="135" height="44" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="132" y="486" text-anchor="middle" font-weight="600">LlmRepository</text>

    <rect x="210" y="460" width="135" height="44" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="277" y="486" text-anchor="middle" font-weight="600">EmbeddingRepo*</text>

    <rect x="355" y="460" width="135" height="44" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="422" y="486" text-anchor="middle" font-weight="600">SettingsRepository</text>

    <!-- Storage row -->
    <rect x="65"  y="516" width="200" height="42" rx="6" fill="#fff7ed" stroke="#d97706"/>
    <text x="165" y="535" text-anchor="middle" font-weight="600">Room DB + FTS4</text>
    <text x="165" y="550" text-anchor="middle" font-size="10">lectures · transcripts · notes</text>

    <rect x="275" y="516" width="215" height="42" rx="6" fill="#fff7ed" stroke="#d97706"/>
    <text x="383" y="535" text-anchor="middle" font-weight="600">App-Private File Storage</text>
    <text x="383" y="550" text-anchor="middle" font-size="10">audio files · exports</text>
  </g>
  <text x="490" y="395" text-anchor="end" font-size="9" fill="#78350f">* stretch</text>

  <!-- Processing Layer -->
  <rect x="520" y="370" width="250" height="200" rx="10" fill="url(#proc)" stroke="#db2777"/>
  <text x="535" y="392" font-size="14" font-weight="700" fill="#831843">Processing  ·  WorkManager</text>
  <g font-size="11" fill="#831843">
    <rect x="535" y="406" width="220" height="36" rx="6" fill="#ffffff" stroke="#db2777"/>
    <text x="645" y="429" text-anchor="middle" font-weight="600">AudioCaptureWorker</text>

    <rect x="535" y="448" width="220" height="36" rx="6" fill="#ffffff" stroke="#db2777"/>
    <text x="645" y="471" text-anchor="middle" font-weight="600">TranscriptionWorker</text>

    <rect x="535" y="490" width="220" height="36" rx="6" fill="#ffffff" stroke="#db2777"/>
    <text x="645" y="513" text-anchor="middle" font-weight="600">SummarizationWorker</text>

    <rect x="535" y="532" width="220" height="36" rx="6" fill="#ffffff" stroke="#db2777"/>
    <text x="645" y="555" text-anchor="middle" font-weight="600">IndexingWorker (FTS / vec*)</text>
  </g>

  <!-- Cross-cutting -->
  <rect x="50" y="590" width="720" height="115" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="65" y="612" font-size="13" font-weight="700" fill="#334155">Cross-Cutting</text>
  <g font-size="11" fill="#334155">
    <rect x="65"  y="626" width="135" height="32" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="132" y="647" text-anchor="middle">Hilt DI</text>
    <rect x="210" y="626" width="135" height="32" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="277" y="647" text-anchor="middle">EncryptedSharedPrefs</text>
    <rect x="355" y="626" width="135" height="32" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="422" y="647" text-anchor="middle">UsageLimiter</text>
    <rect x="500" y="626" width="125" height="32" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="562" y="647" text-anchor="middle">Logger (Timber)</text>
    <rect x="635" y="626" width="125" height="32" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="697" y="647" text-anchor="middle">ConsentManager</text>

    <rect x="65"  y="664" width="280" height="32" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="205" y="685" text-anchor="middle">Result&lt;T&gt; · Coroutines · Flow</text>
    <rect x="355" y="664" width="405" height="32" rx="6" fill="#ffffff" stroke="#64748b"/>
    <text x="557" y="685" text-anchor="middle">Retrofit + OkHttp interceptors (auth, retry, rate-limit backoff)</text>
  </g>

  <!-- External Services -->
  <rect x="810" y="120" width="260" height="600" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="830" y="144" font-size="13" font-weight="600" fill="#475569">External Services</text>

  <rect x="830" y="160" width="220" height="80" rx="10" fill="url(#ext)" stroke="#4f46e5"/>
  <text x="940" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Google Cloud Speech-to-Text</text>
  <text x="940" y="206" text-anchor="middle" font-size="11" fill="#312e81">longRunningRecognize</text>
  <text x="940" y="224" text-anchor="middle" font-size="10" fill="#312e81">diarization · auto punctuation</text>

  <rect x="830" y="260" width="220" height="80" rx="10" fill="url(#ext)" stroke="#4f46e5"/>
  <text x="940" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Google Gemini API</text>
  <text x="940" y="306" text-anchor="middle" font-size="11" fill="#312e81">1.5-flash (map) · 1.5-pro (reduce)</text>
  <text x="940" y="324" text-anchor="middle" font-size="10" fill="#312e81">temperature=0.2 · JSON schema</text>

  <rect x="830" y="360" width="220" height="80" rx="10" fill="url(#ext)" stroke="#4f46e5"/>
  <text x="940" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Gemini Embeddings*</text>
  <text x="940" y="406" text-anchor="middle" font-size="11" fill="#312e81">text-embedding-004</text>
  <text x="940" y="424" text-anchor="middle" font-size="10" fill="#312e81">* stretch feature</text>

  <rect x="830" y="460" width="220" height="100" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-dasharray="5 4"/>
  <text x="940" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#44403c">Phase 2 (if time permits)</text>
  <text x="940" y="506" text-anchor="middle" font-size="10" fill="#44403c">On-device STT (Vosk)</text>
  <text x="940" y="522" text-anchor="middle" font-size="10" fill="#44403c">On-device LLM (Gemma 2B)</text>
  <text x="940" y="544" text-anchor="middle" font-size="10" fill="#44403c">enables offline lecture processing</text>

  <rect x="830" y="580" width="220" height="120" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="940" y="604" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Privacy &amp; Consent</text>
  <text x="940" y="624" text-anchor="middle" font-size="10" fill="#7f1d1d">MVP requires cloud upload to</text>
  <text x="940" y="638" text-anchor="middle" font-size="10" fill="#7f1d1d">process any new lecture.</text>
  <text x="940" y="656" text-anchor="middle" font-size="10" fill="#7f1d1d">Explicit consent prompt first</text>
  <text x="940" y="670" text-anchor="middle" font-size="10" fill="#7f1d1d">time. Model-training opt-out on.</text>
  <text x="940" y="688" text-anchor="middle" font-size="10" fill="#7f1d1d">SA token via EncryptedSharedPrefs</text>

  <!-- Arrows: UI -> Domain -->
  <line x1="400" y1="230" x2="400" y2="248" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- Domain -> Data -->
  <line x1="275" y1="350" x2="275" y2="368" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- Domain -> Processing -->
  <line x1="560" y1="350" x2="600" y2="368" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- Processing -> Data (writes results) -->
  <line x1="535" y1="490" x2="495" y2="490" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- Processing -> External (cloud calls) -->
  <line x1="770" y1="466" x2="828" y2="200" stroke="#4f46e5" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="770" y1="508" x2="828" y2="300" stroke="#4f46e5" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="770" y1="550" x2="828" y2="400" stroke="#4f46e5" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <!-- Processing -> Phase 2 on-device (dashed gray, not yet wired) -->
  <line x1="770" y1="490" x2="828" y2="510" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#arr)"/>

  <!-- Legend -->
  <text x="55" y="755" font-size="10" fill="#475569">
    <tspan font-weight="700">Legend:</tspan>
    <tspan dx="8">solid = in-process call</tspan>
    <tspan dx="14">blue dashed = network call (MVP)</tspan>
    <tspan dx="14">gray dashed = Phase 2 (planned)</tspan>
    <tspan dx="14">* = stretch feature</tspan>
  </text>
</svg>
